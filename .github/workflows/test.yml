name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-check
        run: python3 test_skill_lint.py
      - name: Lint this repository's own skills
        run: python3 skill_lint.py .github

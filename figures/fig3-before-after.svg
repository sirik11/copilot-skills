</filter></defs><rect x="-50" y="-50" width="1700" height="1000" fill="#F4EFE4"/><text x="80" y="96" font-family="'Libre Baskerville', Georgia, serif" font-size="42" fill="#1D1D1B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">Rewrite the description first</text><text x="80" y="138" font-family="'Libre Baskerville', Georgia, serif" font-size="20" fill="#6F6A60" font-weight="400" xml:space="preserve" text-anchor="start" font-style="italic" letter-spacing="0">What it does, when to use it, and the words people actually type.</text><text x="80" y="220" font-family="'Libre Baskerville', Georgia, serif" font-size="15" fill="#6F6A60" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="3">BEFORE</text><text x="120" y="270" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">description: Helps with tests.</text><path d="M302.3110882481792 264.1844794967936 C350.349762090952 256.0270966189311, 403.90355020230527 260.4560799198188, 560.4164440551505 262.481522771803 M301.3383574352231 261.51823388999867 C384.0477870284088 260.49085045219465, 464.221469542204 259.54646080514215, 556.7680965331 261.83813053163516" stroke="#C8352B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="592" y="266" font-family="Kalam, 'Bradley Hand', cursive" font-size="28" fill="#C8352B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-2 592 266)">when? which tests? what words?</text><text x="80" y="360" font-family="'Libre Baskerville', Georgia, serif" font-size="15" fill="#6F6A60" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="3">AFTER</text><text x="120" y="410" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">description: Runs the test suite with the project's flags</text><text x="120" y="456" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">  and fixes failures without weakening assertions.</text><path d="M139.80723256468775 480.52313004136084 L905.6102265298366 483.24482174515725 L908.3904604852198 511.1180820524692 L137.73875474333764 513.8302156507968" stroke="none" stroke-width="0" fill="#F2D64B" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" style="mix-blend-mode:multiply"/><text x="120" y="502" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">  Use when tests fail, when asked to run or fix tests,</text><path d="M140.76648785024884 529.9350193604828 L874.5195498600601 528.7912949666381 L875.3993345871568 557.6798566445709 L144.7600900784135 558.708175097406" stroke="none" stroke-width="0" fill="#F2D64B" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" style="mix-blend-mode:multiply"/><text x="120" y="548" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">  or before opening a pull request, even if the user</text><text x="120" y="594" font-family="'IBM Plex Mono', Menlo, monospace" font-size="24" fill="#1D1D1B" font-weight="400" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0">  only says the build is red.</text><path d="M308.0031064131856 418.06967088192704 C433.644950650081 417.17967554133594, 561.024049736604 416.1669204956687, 941.6370016482472 417.02656254261734 M306.73037509188055 418.536060166508 C548.9084092634648 415.4289211186046, 792.0472771864861 414.54978052318336, 940.9695583795011 416.7925368978083" stroke="#2E6BA6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M148.96317394390704 465.72944633588196 C287.71900263962004 465.69340864961475, 426.4985134643004 465.300376320346, 839.2725886406005 462.12627042397855 M148.52712237648666 465.244235387519 C289.86065977462385 463.60450341322274, 430.2142142666207 462.763642370075, 840.4045487790555 462.6541137868911" stroke="#2E6BA6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M418.35962569614725 559.8832668603035 C433.92791415886893 559.6508718882131, 452.00102077179713 562.2619374761714, 466.2446316321496 563.8865281364632 C480.4882424925021 565.511118796755, 493.49654194357424 567.2569506035325, 503.821290858262 569.630810822054 C514.1460397729497 572.0046710405754, 523.2353230205001 575.0131357569317, 528.1931251202761 578.129689447592 C533.1509272200522 581.2462431382523, 534.8904159203375 585.240938471502, 533.568103456918 588.330132966016 C532.2457909934985 591.41932746053, 527.4772884681468 593.9812419698193, 520.2592503397594 596.6648564146759 C513.0412122113721 599.3484708595325, 502.80735728218724 602.2816400457281, 490.2598746865938 604.4318196351556 C477.7123920910003 606.5819992245832, 460.32548778079143 608.4096998949178, 444.9743547661986 609.5659339512416 C429.62322175160574 610.7221680075654, 414.05873781001236 611.7348768772832, 398.1530765990368 611.3692239730982 C382.24741538806126 611.0035710689132, 364.16788072433496 608.748848988639, 349.5403875003452 607.3720165261317 C334.9128942763555 605.9951840636244, 320.74356758453007 605.4700805270595, 310.3881172550983 603.1082291980542 C300.0326669256665 600.746377869049, 292.05104845396454 596.390974796929, 287.40768552375437 593.2009085520999 C282.7643225935442 590.0108423072709, 281.16346282112534 587.1064573568643, 282.5279396738372 583.9678317290801 C283.892416526549 580.829206101295
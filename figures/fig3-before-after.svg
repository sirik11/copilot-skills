8 C282.11649429750236 578.8858681921361, 288.237819557795 575.7772725319821, 296.1165071225331 573.3856026384769 C303.99519468727124 570.9939327449717, 315.83625422378384 569.4649438853139, 328.0260444462876 567.8029441407054 C340.21583466879133 566.140944396097, 362.16002816584427 564.4876486556113, 369.2552484575555 563.4136041708261 C376.3504687492668 562.339559686041, 369.77662386339 561.3224348381927, 370.59736619655524 561.3586772319944" stroke="#C8352B" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1180" y="424" font-family="Kalam, 'Bradley Hand', cursive" font-size="30" fill="#2E6BA6" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-2 1180 424)">what it does</text><text x="1180" y="532" font-family="Kalam, 'Bradley Hand', cursive" font-size="30" fill="#1D1D1B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-2 1180 532)">when to use it</text><text x="1180" y="598" font-family="Kalam, 'Bradley Hand', cursive" font-size="30" fill="#C8352B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-2 1180 598)">the words a dev</text><text x="1180" y="632" font-family="Kalam, 'Bradley Hand', cursive" font-size="30" fill="#C8352B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-2 1180 632)">actually types</text><path d="M1165.9062816590686 602.6619648974818 C1118.3767166810849 607.8482459828339, 981.489961975636 635.2711925901256, 879.4835663403292 634.2228140272182 C777.4771707050223 633.1744354643108, 608.3355179492651 602.6175956431509, 553.8679078472275 596.3716935200374 M1164.222891310509 604.8844495851527 C1116.588627726827 609.7146683389257, 979.9597948594372 633.1035598935573, 878.1497249013325 631.9633122220704 C776.3396549432279 630.8230645505835, 607.6075552410066 604.3237052998692, 553.3624715618809 598.042963556231" stroke="#C8352B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.7179034315049 594.9165421761572 C554.7671641370054 594.9492734006237, 559.8912233480659 593.3085537362454, 565.8525819094466 590.7738661107525 M553.540033103898 596.1379582684488 C557.4595666266923 594.0888974387153, 560.1232151075089 592.1406496725548, 566.8491930095093 590.1882772386922" stroke="#C8352B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M553.032261500135 596.6948730196804 C555.3691408449307 597.396341784328, 557.591384912017 599.4954224417862, 564.790199590473 605.1708069277813 M553.750833765976 595.6967174338176 C556.9044635467981 598.3458335204783, 560.3318281572575 601.5621444521927, 565.314742912537 605.4015062782798" stroke="#C8352B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="760" font-family="Kalam, 'Bradley Hand', cursive" font-size="32" fill="#1D1D1B" font-weight="700" xml:space="preserve" text-anchor="start" font-style="normal" letter-spacing="0" transform="rotate(-0.8 80 760)">a vague description never runs. a broad one runs when it shouldn’t.</text><text x="80" y="868" font-family="'Libre Baskerville', Georgia, serif" font-size="14" fill="#6F6A60" font-weight="400" xml:space="preserve" text-anchor="start" font-style="italic" letter-spacing="0">Pattern from the Agent Skills specification and its guide to optimizing descriptions (agentskills.io).</text><rect x="-50" y="-50" width="1700" height="1000" filter="url(#grain)"/></svg>